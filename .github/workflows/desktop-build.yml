name: Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "desktop/**"
      - "templates/**"
      - "static/**"
      - ".github/workflows/desktop-build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-universal
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust（macOS 附带 universal 双架构 target）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: 同步 UI（从 templates/ + static/ 生成）
        run: node scripts/sync-ui.mjs

      - name: 安装前端依赖
        run: npm install --no-fund --no-audit

      - name: 构建（Windows 出 NSIS/MSI，macOS 出 universal App/Dmg）
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            npm run tauri build -- --target universal-apple-darwin
          else
            npm run tauri build
          fi

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ScriptDeck-${{ matrix.label }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/**/*.app.tar.gz
          if-no-files-found: error
