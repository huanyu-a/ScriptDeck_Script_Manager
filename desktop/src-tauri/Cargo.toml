[package]
name = "scriptdeck"
version = "1.0.0"
description = "ScriptDeck 脚本中台桌面版"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
encoding_rs = "0.8"
wildmatch = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
